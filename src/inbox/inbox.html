<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Posteingang</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="inbox.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="account" id="account"></header>
        <div class="list" id="list"></div>
      </aside>
      <section class="reading">
        <div class="reading-body" id="reading">
          <div class="empty-state">
            <div class="empty-mark" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.8" />
                <path d="M4 7.5 12 13l8-5.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              </svg>
            </div>
            <p class="empty-title">Keine Nachricht ausgewählt</p>
            <p class="empty-copy">Nachrichten erscheinen hier, sobald sie ankommen.</p>
          </div>
        </div>
        <footer class="reading-foot" id="credits"></footer>
      </section>
    </div>
    <script type="module" src="inbox.js"></script>
  </body>
</html>
