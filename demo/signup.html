<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrierung</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f2f2f7;
        color: #1c1c1e;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .hint,
      label {
        color: rgba(60, 60, 67, 0.72);
        font-size: 13px;
        line-height: 18px;
      }
      form,
      pre {
        margin-top: 16px;
        padding: 16px;
        border-radius: 16px;
        background: #fff;
      }
      label {
        display: block;
        margin: 12px 0 6px;
      }
      input,
      select {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid rgba(60, 60, 67, 0.18);
        border-radius: 10px;
        font: inherit;
        font-size: 15px;
        background: #fff;
      }
      button {
        margin-top: 16px;
        padding: 10px 14px;
        border: 0;
        border-radius: 10px;
        background: #0a84ff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      h2 {
        margin: 28px 0 0;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Konto erstellen</h1>
      <p class="hint">
        Lokales Formular für die Erweiterung. In Chrome unter „Datei-URLs zulassen“ aktivieren, oder diese Datei über einen lokalen Server öffnen.
      </p>
      <form id="signup">
        <label for="honorific">Anrede</label>
        <select id="honorific" name="honorific" autocomplete="honorific-prefix">
          <option value="">Bitte wählen</option>
          <option value="Frau">Frau</option>
          <option value="Herr">Herr</option>
        </select>
        <label for="given">Vorname</label>
        <input id="given" name="given-name" type="text" autocomplete="given-name" required />
        <label for="family">Nachname</label>
        <input id="family" name="family-name" type="text" autocomplete="family-name" required />
        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />
        <label for="confirm">Passwort bestätigen</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
        <button type="submit">Konto erstellen</button>
      </form>
      <pre id="signup-result" hidden></pre>

      <h2>Anmelden</h2>
      <form id="login">
        <label for="login-email">E-Mail</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required />
        <label for="login-password">Passwort</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Anmelden</button>
      </form>
      <pre id="login-result" hidden></pre>
    </main>
    <script>
      function watch(formId, resultId) {
        const form = document.getElementById(formId);
        const result = document.getElementById(resultId);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const lines = [...new FormData(form).entries()].map(([key, value]) => `${key}: ${value}`);
          result.hidden = false;
          result.textContent = lines.join("\n");
        });
      }
      watch("signup", "signup-result");
      watch("login", "login-result");
    </script>
  </body>
</html>
